name: Continuous Integration with GitHub Actions

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3.4.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for Gradle
      run: chmod +x gradlew

    - name: Build JAR with Gradle (skip tests)
      run: ./gradlew build -x test

    - name: Docker Compose Build
      run: docker compose build

    - name: Push to Docker Hub Container Registry
      run: |
        docker tag kenshiro1337/cadastroapi:latest kenshiro1337/cadastroapi:${{ github.run_id }}
        docker push kenshiro1337/cadastroapi:${{ github.run_id }}
        docker push kenshiro1337/cadastroapi:latest
