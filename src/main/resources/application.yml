
spring:
  application:
    name: cadastro-api
  datasource:
    initialization-mode: always
    url: jdbc:postgresql://localhost:5432/cadastrodb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
