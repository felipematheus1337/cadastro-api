version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cadastro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastrodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cadastro-network

volumes:
  postgres_data:

networks:
  cadastro-network:
